epochs: 100
patience: 50
batch: ${data.batch_size}
imgsz: ${data.img_size}
device: "0"
workers: ${data.workers}
optimizer: "auto"
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 7.5
cls: 0.5
dfl: 1.5
overlap_mask: true
mask_ratio: 4

augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0

validation:
  save: true
  save_json: false
  save_hybrid: false
  save_conf: false
  save_txt: false
  iou: 0.7
  conf: 0.001
  max_det: 300
  half: false
  device: ${train.device}
