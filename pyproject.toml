[tool.poetry]
name = "lenta-price-tag-scanner"
version = "0.1.0"
description = "Price tag detection using YOLOv8"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "lenta_price_tag_scanner"}]

[tool.poetry.dependencies]
python = "^3.10"  # ^3.10 разрешает использование 3.10, 3.11, 3.12 и т.д.
ultralytics = "^8.2.0"
torch = "^2.2.0"
torchvision = "^0.17.0"
hydra-core = "^1.3.0"
mlflow = "^2.10.0"
dvc = "^3.49.0"
gitpython = "^3.1.0"
opencv-python = "^4.9.0"
fire = "^0.6.0"
omegaconf = "^2.3.0"

[tool.poetry.scripts]
price-scanner = "lenta_price_tag_scanner.commands:main"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.7.0"
black = "^24.4.0"
isort = "^5.13.0"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
