[tool.poetry]
name = "lenta-price-tag-scanner"
version = "0.1.0"
description = "Hackathon pipeline for recognizing Lenta price tags from robot shelf videos."
authors = ["TM1550"]
readme = "README.md"
package-mode = true

[tool.poetry.dependencies]
python = "^3.12"

# Основные библиотеки
numpy = "^1.26"
pandas = "^2.2"
pillow = "^10.0"
opencv-python-headless = "^4.9"
gradio = "^4.44"
scikit-learn = "^1.5"

# Обязательные инструменты MLsysd
hydra-core = "^1.3"
mlflow = "^2.15"
dvc = "^3.50"
dvc-gdrive = "^3.0"

# Фикс для ошибки GEN_EMAIL в Google Drive
cryptography = "<42.0.0"
pyopenssl = ">=23.2.0"

# PyTorch (источник указан ниже)
torch = {version = "^2.4.0+cu121", source = "pytorch"}
torchvision = {version = "^0.19.0+cu121", source = "pytorch"}
dvc-webdav = "^3.0.1"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.7"
black = "^24.4"
isort = "^5.13"
flake8 = "^7.0"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
